<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크리스마스 영화 티어리스트</title>
<style>
:root{
  --night:#10231e; --panel:#1a3329; --line:#2e4d3f; --snow:#f7f1e5; --ink:#1d1a16; --muted:#b9c7bd;
  --s:#b3243a; --a:#d9a441; --b:#4f8a68; --c:#7f95a3; --focus:#ffd98a;
  --serif:'Nanum Myeongjo','Noto Serif KR','Noto Serif CJK KR','Source Han Serif K','AppleMyungjo','Batang',serif;
  --sans:'Pretendard','Noto Sans KR','Noto Sans CJK KR','Nanum Gothic','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--snow);font-family:var(--sans);line-height:1.6;letter-spacing:-.01em;word-break:keep-all;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{font-weight:800;word-break:keep-all}
h1{letter-spacing:-.03em;line-height:1.25}
.info strong{font-weight:700}
.tier-label span{font-weight:500}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px}
h1{font-family:var(--serif);font-size:clamp(26px,4.5vw,40px);margin:0;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--muted);font-size:15px}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:8px;padding:9px 16px;background:var(--a);color:var(--ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--snow);border:1px solid var(--muted)}
.btn.danger{background:var(--s);color:#fff}
.btn:hover{filter:brightness(1.08)}

/* 입력 폼 */
.form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:26px}
.form h2{font-family:var(--serif);font-size:20px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
label,.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],select,input[type=file]{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--snow);color:var(--ink);font:inherit}
input[type=file]{background:transparent;color:var(--snow);padding:7px 0;border:0}
.err{color:#ffb4bf;font-size:14px;min-height:20px;margin:4px 0 0}
.otts{display:flex;flex-wrap:wrap;gap:8px}
.otts label{display:inline-flex;align-items:center;gap:6px;margin:0;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--snow);cursor:pointer;font-size:14px}
.otts label:has(input:checked){background:var(--snow);color:var(--ink);border-color:var(--snow);font-weight:700}
.otts input{accent-color:var(--s)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}

/* 티어 */
.tier{display:grid;grid-template-columns:150px 1fr;margin-bottom:10px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.tier-label{padding:14px;display:flex;flex-direction:column;justify-content:center;color:#fff}
.tier-label b{font-family:var(--serif);font-size:46px;line-height:1}
.tier-label span{font-size:13px;margin-top:6px;line-height:1.35}
.tier[data-t=S] .tier-label{background:var(--s)}
.tier[data-t=A] .tier-label{background:var(--a);color:var(--ink)}
.tier[data-t=B] .tier-label{background:var(--b)}
.tier[data-t=C] .tier-label{background:var(--c);color:var(--ink)}
.tier[data-t=U] .tier-label{background:#33493f}
.tier[data-t=U] .tier-label b{font-size:24px}
.zone{display:flex;flex-wrap:wrap;gap:10px;padding:10px;min-height:110px;background:var(--panel);align-content:flex-start}
.zone:empty::before{content:"여기로 카드를 끌어 놓으세요";color:var(--muted);font-size:14px;align-self:center;padding:0 6px}
.zone.over{background:#27483a;outline:2px dashed var(--focus);outline-offset:-4px}
h2.sec{font-family:var(--serif);font-size:20px;margin:26px 0 10px}

/* 카드 */
.card{width:132px;background:var(--snow);color:var(--ink);border-radius:8px;overflow:hidden;cursor:grab;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.card.dragging{opacity:.4}
.poster{aspect-ratio:2/3;background:#e3d8c3;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:7px 8px 9px}
.info strong{display:block;font-size:14px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.info small{display:block;color:#5a5348;font-size:12px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.chips i{font-style:normal;font-size:11px;background:#1a3329;color:var(--snow);padding:1px 6px;border-radius:999px}
.chips i.none{background:#d8cdb8;color:#5a5348}

/* 대화상자 */
dialog{border:0;border-radius:14px;padding:0;max-width:440px;width:calc(100% - 32px);background:var(--snow);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{padding:20px}
.dlg h3{font-family:var(--serif);margin:0 0 2px;font-size:22px}
.dlg .meta{color:#5a5348;font-size:14px;margin:0 0 12px}
.dlg .row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px}
.tbtn{min-width:46px;padding:8px 12px;border-radius:8px;border:1px solid #bdb29c;background:#fff;color:var(--ink);font-weight:700}
.tbtn[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.dlg .btn.ghost{color:var(--ink);border-color:#8a8070}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--snow);color:var(--ink);padding:10px 16px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.4);font-size:14px;max-width:90%;display:none;z-index:10}

@media(max-width:700px){
  .grid{grid-template-columns:1fr}
  .tier{grid-template-columns:1fr}
  .tier-label{flex-direction:row;align-items:center;gap:12px}
  .tier-label span{margin:0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🎄 크리스마스 영화 티어리스트</h1>
      <p>크리스마스에 보기 좋은 영화를 등급별로 정리해 보세요.</p>
    </div>
    <button class="btn danger" id="resetBtn" type="button">초기화</button>
  </header>

  <section class="form" aria-labelledby="formTitle">
    <h2 id="formTitle">영화 추가</h2>
    <div class="grid">
      <div>
        <label for="fTitle">제목</label>
        <input type="text" id="fTitle" maxlength="100" autocomplete="off">
        <p class="err" id="fErr" role="alert"></p>
      </div>
      <div>
        <label for="fYear">개봉 연도</label>
        <input type="number" id="fYear" inputmode="numeric" placeholder="예: 1990">
      </div>
      <div>
        <label for="fGenre">장르</label>
        <select id="fGenre"></select>
      </div>
      <div class="full">
        <label for="fPoster">포스터 이미지 (선택)</label>
        <input type="file" id="fPoster" accept="image/*">
        <label id="rmPosterWrap" style="display:none;color:var(--snow)"><input type="checkbox" id="rmPoster"> 등록된 포스터 지우기</label>
        <p class="hint">내 컴퓨터의 이미지 파일을 고르면 이 브라우저에만 저장돼요.</p>
      </div>
      <div class="full">
        <span class="lbl">시청 가능한 OTT (여러 개 선택 가능)</span>
        <div class="otts" id="fOtts"></div>
        <p class="hint">직접 기록하는 항목이에요. 실제 제공 여부는 확인하지 않아요.</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="submitBtn" type="button">영화 추가</button>
      <button class="btn ghost" id="cancelBtn" type="button" style="display:none">수정 취소</button>
    </div>
  </section>

  <h2 class="sec">추천 등급</h2>
  <div id="tiers"></div>

  <h2 class="sec">미분류</h2>
  <div id="unclassified"></div>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  'use strict';
  var KEY = 'christmas-movie-tierlist-v1';
  var GENRES = ['코미디','로맨스','드라마','가족','애니메이션','판타지','액션','SF','스릴러','공포','기타'];
  var OTTS = ['넷플릭스','디즈니+','티빙','웨이브','쿠팡플레이','왓챠','애플 TV+','아마존 프라임 비디오','기타'];
  var TIERS = [
    {id:'S', desc:'크리스마스에 꼭 봐야 하는 영화'},
    {id:'A', desc:'크리스마스에 보기 좋은 영화'},
    {id:'B', desc:'괜찮지만 크리스마스 분위기는 보통인 영화'},
    {id:'C', desc:'크리스마스에 굳이 추천하지 않는 영화'}
  ];
  var movies = [];
  var editingId = null;
  var zones = {};

  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text !== undefined) e.textContent = text;
    return e;
  }

  /* ---------- 저장 / 불러오기 ---------- */
  function load(){
    try{
      var d = JSON.parse(localStorage.getItem(KEY));
      if(Array.isArray(d)){
        movies = d.filter(function(m){ return m && typeof m.id === 'string' && typeof m.title === 'string'; })
                  .map(function(m){
                    m.tier = (['S','A','B','C'].indexOf(m.tier) >= 0) ? m.tier : 'U';
                    m.otts = Array.isArray(m.otts) ? m.otts : [];
                    return m;
                  });
      }
    }catch(e){ movies = []; }
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(movies)); return true; }
    catch(e){
      toast('브라우저 저장 공간이 부족해 저장하지 못했어요. 포스터를 빼거나 영화를 줄여 보세요.');
      return false;
    }
  }
  var toastTimer;
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.style.display = 'none'; }, 3500);
  }

  /* ---------- 포스터 처리: 저장 공간을 아끼려고 줄여서 보관 ---------- */
  function readPoster(file){
    return new Promise(function(resolve, reject){
      var fr = new FileReader();
      fr.onerror = function(){ reject(); };
      fr.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(); };
        img.onload = function(){
          var max = 320, r = Math.min(1, max / Math.max(img.width, img.height));
          var cv = document.createElement('canvas');
          cv.width = Math.round(img.width * r); cv.height = Math.round(img.height * r);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          resolve(cv.toDataURL('image/jpeg', 0.82));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  /* ---------- 폼 ---------- */
  function buildForm(){
    var g = $('fGenre');
    g.appendChild(new Option('장르 선택', ''));
    GENRES.forEach(function(x){ g.appendChild(new Option(x, x)); });
    var box = $('fOtts');
    OTTS.forEach(function(n){
      var l = el('label'); var c = document.createElement('input');
      c.type = 'checkbox'; c.value = n; l.appendChild(c); l.appendChild(document.createTextNode(n));
      box.appendChild(l);
    });
  }
  function checkedOtts(){
    return Array.prototype.map.call($('fOtts').querySelectorAll('input:checked'), function(c){ return c.value; });
  }
  function resetForm(){
    editingId = null;
    $('fTitle').value = ''; $('fYear').value = ''; $('fGenre').value = ''; $('fPoster').value = '';
    $('rmPoster').checked = false; $('rmPosterWrap').style.display = 'none';
    Array.prototype.forEach.call($('fOtts').querySelectorAll('input'), function(c){ c.checked = false; });
    $('fErr').textContent = '';
    $('formTitle').textContent = '영화 추가';
    $('submitBtn').textContent = '영화 추가';
    $('cancelBtn').style.display = 'none';
  }
  function startEdit(id){
    var m = find(id); if(!m) return;
    editingId = id;
    $('fTitle').value = m.title; $('fYear').value = m.year || ''; $('fGenre').value = m.genre || '';
    $('fPoster').value = ''; $('rmPoster').checked = false;
    $('rmPosterWrap').style.display = m.poster ? 'block' : 'none';
    Array.prototype.forEach.call($('fOtts').querySelectorAll('input'), function(c){ c.checked = m.otts.indexOf(c.value) >= 0; });
    $('fErr').textContent = '';
    $('formTitle').textContent = '영화 정보 수정';
    $('submitBtn').textContent = '수정 저장';
    $('cancelBtn').style.display = 'inline-block';
    $('formTitle').scrollIntoView({behavior:'smooth', block:'start'});
    $('fTitle').focus();
  }
  async function submitForm(){
    var title = $('fTitle').value.trim();
    if(!title){
      $('fErr').textContent = '영화 제목을 입력해 주세요.';
      $('fTitle').focus();
      return;
    }
    $('fErr').textContent = '';
    var year = $('fYear').value.trim();
    var genre = $('fGenre').value;
    var otts = checkedOtts();
    var file = $('fPoster').files[0];
    var poster;
    if(file){
      try{ poster = await readPoster(file); }
      catch(e){ toast('이미지를 읽지 못했어요. 다른 이미지 파일을 선택해 주세요.'); return; }
    }
    if(editingId){
      var m = find(editingId);
      if(m){
        m.title = title; m.year = year; m.genre = genre; m.otts = otts;
        if(poster) m.poster = poster;
        else if($('rmPoster').checked) m.poster = '';
      }
    }else{
      movies.push({id: 'm' + Date.now() + Math.random().toString(36).slice(2,6),
        title: title, year: year, genre: genre, otts: otts, poster: poster || '', tier: 'U'});
    }
    save(); render(); resetForm();
  }

  /* ---------- 데이터 조작 ---------- */
  function find(id){ for(var i=0;i<movies.length;i++) if(movies[i].id===id) return movies[i]; return null; }
  function setTier(id, t){
    var m = find(id); if(!m || m.tier === t) return;
    m.tier = t; save(); render();
  }
  function removeMovie(id){
    movies = movies.filter(function(m){ return m.id !== id; });
    if(editingId === id) resetForm();
    save(); render();
  }

  /* ---------- 화면 그리기 ---------- */
  function buildTiers(){
    var root = $('tiers');
    TIERS.forEach(function(t){ root.appendChild(makeTier(t.id, t.id, t.desc)); });
    $('unclassified').appendChild(makeTier('U', '미분류', '아직 등급을 정하지 않은 영화'));
  }
  function makeTier(id, big, desc){
    var row = el('div','tier'); row.dataset.t = id;
    var lab = el('div','tier-label'); lab.appendChild(el('b','',big)); lab.appendChild(el('span','',desc));
    var zone = el('div','zone'); zone.dataset.t = id;
    zone.addEventListener('dragover', function(e){ e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', function(e){ if(!zone.contains(e.relatedTarget)) zone.classList.remove('over'); });
    zone.addEventListener('drop', function(e){
      e.preventDefault(); zone.classList.remove('over');
      var mid = e.dataTransfer.getData('text/plain');
      if(mid) setTier(mid, id);
    });
    zones[id] = zone;
    row.appendChild(lab); row.appendChild(zone);
    return row;
  }
  function makeCard(m){
    var c = el('div','card'); c.draggable = true; c.tabIndex = 0; c.dataset.id = m.id;
    c.setAttribute('role','button');
    c.setAttribute('aria-label', m.title + ' 카드, 눌러서 등급 선택');
    var p = el('div','poster');
    if(m.poster){ var img = document.createElement('img'); img.src = m.poster; img.alt = m.title + ' 포스터'; img.draggable = false; p.appendChild(img); }
    else p.textContent = '🎬';
    var info = el('div','info');
    info.appendChild(el('strong','',m.title));
    info.appendChild(el('small','', (m.year ? m.year + '년' : '연도 미입력') + ' / ' + (m.genre || '장르 미선택')));
    var chips = el('div','chips');
    if(m.otts.length) m.otts.forEach(function(n){ chips.appendChild(el('i','',n)); });
    else chips.appendChild(el('i','none','OTT 미등록'));
    info.appendChild(chips);
    c.appendChild(p); c.appendChild(info);
    c.addEventListener('dragstart', function(e){
      e.dataTransfer.setData('text/plain', m.id); e.dataTransfer.effectAllowed = 'move';
      c.classList.add('dragging');
    });
    c.addEventListener('dragend', function(){ c.classList.remove('dragging'); });
    c.addEventListener('click', function(){ openDialog(m.id); });
    c.addEventListener('keydown', function(e){ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openDialog(m.id); } });
    return c;
  }
  function render(){
    Object.keys(zones).forEach(function(k){ zones[k].textContent = ''; });
    movies.forEach(function(m){ (zones[m.tier] || zones.U).appendChild(makeCard(m)); });
  }

  /* ---------- 카드 클릭 대화상자 ---------- */
  function openDialog(id){
    var m = find(id); if(!m) return;
    var d = $('dlg'); d.textContent = '';
    var box = el('div','dlg');
    var h = el('h3','',m.title); h.id = 'dlgTitle';
    box.appendChild(h);
    box.appendChild(el('p','meta', (m.year ? m.year + '년' : '연도 미입력') + ' / ' + (m.genre || '장르 미선택') + ' / ' + (m.otts.length ? m.otts.join(', ') : 'OTT 미등록')));
    box.appendChild(el('div','lbl','등급 선택'));
    var row = el('div','row');
    TIERS.concat([{id:'U'}]).forEach(function(t){
      var b = el('button','tbtn', t.id === 'U' ? '미분류' : t.id); b.type = 'button';
      b.setAttribute('aria-pressed', m.tier === t.id ? 'true' : 'false');
      b.addEventListener('click', function(){ setTier(id, t.id); d.close(); });
      row.appendChild(b);
    });
    box.appendChild(row);
    var act = el('div','row');
    var e = el('button','btn','정보 수정'); e.type='button';
    e.addEventListener('click', function(){ d.close(); startEdit(id); });
    var x = el('button','btn danger','삭제'); x.type='button';
    x.addEventListener('click', function(){
      if(confirm('"' + m.title + '" 영화를 삭제할까요?')){ d.close(); removeMovie(id); }
    });
    var cl = el('button','btn ghost','닫기'); cl.type='button';
    cl.addEventListener('click', function(){ d.close(); });
    act.appendChild(e); act.appendChild(x); act.appendChild(cl);
    box.appendChild(act);
    d.appendChild(box);
    if(typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open','');
  }
  $('dlg').addEventListener('click', function(e){ if(e.target === this) this.close(); });

  /* ---------- 초기화 ---------- */
  $('resetBtn').addEventListener('click', function(){
    if(confirm('등록한 영화와 등급 배치를 모두 지우고 처음 상태로 되돌릴까요?\n이 작업은 되돌릴 수 없어요.')){
      movies = [];
      try{ localStorage.removeItem(KEY); }catch(e){}
      resetForm(); render();
    }
  });

  /* ---------- 시작 ---------- */
  $('submitBtn').addEventListener('click', submitForm);
  $('cancelBtn').addEventListener('click', resetForm);
  $('fTitle').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); submitForm(); } });
  buildForm(); buildTiers(); load(); render();
})();
</script>
</body>
</html>
